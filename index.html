<style>
  :root {
    --bg: #f7f3ee; --card: #ffffff; --texto: #2b2420; --suave: #6f645c;
    --linha: #e6ddd3; --verde: #1f6b4f; --verde-claro: #e3f1ea;
    --vermelho: #b3261e; --vermelho-claro: #fbe9e7; --botao: #1f6b4f; --botao-texto: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1816; --card: #26221f; --texto: #f3ede7; --suave: #b5aaa0;
      --linha: #3a342f; --verde: #7fd1ae; --verde-claro: #203a30;
      --vermelho: #ff8a80; --vermelho-claro: #3d2422; --botao: #2f8a66; --botao-texto: #fff;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--texto);
    font: 19px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .tela { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  header h1 { font-size: 26px; line-height: 1.2; margin: 4px 0 6px; }
  header p { margin: 0; color: var(--suave); font-size: 16px; }
  .pergunta { font-size: 22px; font-weight: 700; margin: 24px 0 12px; }
  .busca {
    width: 100%; font-size: 19px; padding: 14px 16px; border-radius: 14px;
    border: 2px solid var(--linha); background: var(--card); color: var(--texto);
  }
  .busca:focus { outline: none; border-color: var(--verde); }
  ul.lista { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 10px; }
  .pessoa {
    width: 100%; display: flex; align-items: center; gap: 14px; text-align: left;
    background: var(--card); color: var(--texto); border: 1px solid var(--linha);
    border-radius: 16px; padding: 16px; font: inherit; cursor: pointer; min-height: 64px;
  }
  .pessoa:active { transform: scale(.98); }
  .inicial {
    flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
    background: var(--verde-claro); color: var(--verde); font-weight: 700; font-size: 20px;
  }
  .pessoa .nome { flex: 1; font-weight: 600; }
  .pessoa .seta { color: var(--suave); font-size: 24px; }
  .selo { font-size: 14px; color: var(--suave); display: block; font-weight: 400; }
  .vazio-busca { color: var(--suave); text-align: center; padding: 24px 0; }

  .voltar {
    display: inline-flex; align-items: center; gap: 8px; font: inherit; font-weight: 600;
    background: var(--card); color: var(--texto); border: 1px solid var(--linha);
    border-radius: 999px; padding: 10px 18px; cursor: pointer;
  }
  .detalhe h2 { font-size: 28px; line-height: 1.2; margin: 22px 0 4px; }
  .detalhe .sub { color: var(--suave); margin: 0 0 18px; font-size: 16px; }
  .presente {
    background: var(--card); border: 1px solid var(--linha); border-radius: 18px;
    padding: 18px; margin-bottom: 14px;
  }
  .presente .opc { font-size: 14px; font-weight: 700; color: var(--verde); text-transform: uppercase; letter-spacing: .04em; }
  .presente .desc { font-size: 21px; font-weight: 600; margin: 4px 0 10px; overflow-wrap: anywhere; }
  .infos { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  .info { background: var(--bg); border-radius: 10px; padding: 6px 12px; font-size: 16px; }
  .info b { font-weight: 600; }
  .promo { background: var(--vermelho-claro); color: var(--vermelho); font-weight: 600; }
  .loja {
    display: block; text-align: center; margin-top: 14px; padding: 15px; border-radius: 14px;
    background: var(--botao); color: var(--botao-texto); text-decoration: none; font-weight: 700;
  }
  .sem-link { margin-top: 12px; color: var(--suave); font-size: 16px; }
  .nada {
    background: var(--card); border: 1px dashed var(--linha); border-radius: 18px;
    padding: 28px 18px; text-align: center; color: var(--suave);
  }
  .nada .emoji { font-size: 40px; }
  footer { margin-top: 28px; text-align: center; color: var(--suave); font-size: 15px; }
</style>
</head>

<script>
(function () {
  var D = JSON.parse(document.getElementById("dados").textContent);
  var app = document.getElementById("app");
  var busca = "";

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function semAcento(s) {
    return s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  }
  function rodape() {
    return '<footer>Lista atualizada em ' + esc(D.atualizado) + '</footer>';
  }

  function telaLista() {
    document.title = D.titulo;
    app.innerHTML =
      '<header><h1>🎁 ' + esc(D.titulo) + '</h1>' +
      '<p>Preço médio do presente: ' + esc(D.precoMedio) + '</p></header>' +
      '<div class="pergunta">Quem você tirou?</div>' +
      '<input class="busca" type="search" placeholder="Digite o nome para procurar" aria-label="Procurar pessoa" autocomplete="off">' +
      '<ul class="lista"></ul>' + rodape();
    var campo = app.querySelector(".busca");
    campo.value = busca;
    ["input", "keyup", "search", "change"].forEach(function (ev) {
      campo.addEventListener(ev, function () {
        if (campo.value === busca) return;
        busca = campo.value; desenhaLista();
      });
    });
    desenhaLista();
  }

  function desenhaLista() {
    var ul = app.querySelector(".lista");
    var termo = semAcento(busca.trim());
    var html = "";
    D.pessoas.forEach(function (p) {
      if (termo && semAcento(p.nome).indexOf(termo) === -1) return;
      var n = p.presentes.length;
      var selo = n ? n + (n === 1 ? " opção de presente" : " opções de presente") : "Ainda não escolheu";
      html += '<li><button class="pessoa" data-id="' + esc(p.id) + '">' +
        '<span class="inicial">' + esc(p.nome.charAt(0)) + '</span>' +
        '<span class="nome">' + esc(p.nome) + '<span class="selo">' + selo + '</span></span>' +
        '<span class="seta">›</span></button></li>';
    });
    ul.innerHTML = html || '<li class="vazio-busca">Ninguém encontrado com esse nome.</li>';
  }

  function telaPessoa(p) {
    document.title = p.nome + " · " + D.titulo;
    var corpo = "";
    if (!p.presentes.length) {
      corpo = '<div class="nada"><div class="emoji">⏳</div>' +
        '<p><b>' + esc(p.nome) + '</b> ainda não escolheu os presentes.</p>' +
        '<p>Volte aqui mais tarde, a lista é atualizada sempre que chegam novidades.</p></div>';
    } else {
      p.presentes.forEach(function (g) {
        var infos = "";
        if (g.cor) infos += '<span class="info"><b>Cor:</b> ' + esc(g.cor) + '</span>';
        if (g.tamanho) infos += '<span class="info"><b>Tamanho:</b> ' + esc(g.tamanho) + '</span>';
        if (g.preco) infos += '<span class="info"><b>Valor aprox.:</b> ' + esc(g.preco) + '</span>';
        if (g.promo) infos += '<span class="info promo">🔥 Em promoção</span>';
        corpo += '<article class="presente">' +
          '<div class="opc">Opção ' + esc(g.opcao) + '</div>' +
          '<div class="desc">' + esc(g.descricao) + '</div>' +
          (infos ? '<div class="infos">' + infos + '</div>' : '') +
          (g.link
            ? '<a class="loja" href="' + esc(g.link) + '" target="_blank" rel="noopener noreferrer">Ver na loja ↗</a>'
            : '<div class="sem-link">Sem link — pode comprar em qualquer loja.</div>') +
          '</article>';
      });
    }
    app.innerHTML =
      '<div class="detalhe"><button class="voltar">‹ Voltar para a lista</button>' +
      '<h2>' + esc(p.nome) + '</h2>' +
      '<p class="sub">' + (p.presentes.length ? "Escolha uma das opções abaixo:" : "") + '</p>' +
      corpo + '</div>' + rodape();
    window.scrollTo(0, 0);
  }

  function rota() {
    var id = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
    var p = D.pessoas.filter(function (x) { return x.id === id; })[0];
    if (p) telaPessoa(p); else telaLista();
  }

  app.addEventListener("click", function (e) {
    var b = e.target.closest(".pessoa");
    if (b) { location.hash = "/" + b.getAttribute("data-id"); return; }
    if (e.target.closest(".voltar")) {
      // Veio da lista: volta no histórico (o botão "voltar" do celular fica coerente).
      // Abriu direto num link de pessoa: vai para a lista.
      if (veioDaLista) history.back(); else location.hash = "";
    }
  });

  var veioDaLista = false;
  var ultimaFoiLista = !location.hash.replace(/^#\/?/, "");
  window.addEventListener("hashchange", function () {
    var naLista = !location.hash.replace(/^#\/?/, "");
    if (!naLista) veioDaLista = ultimaFoiLista;
    ultimaFoiLista = naLista;
    rota();
  });
  rota();
})();
</script>
